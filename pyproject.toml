[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "li-harvester"
version = "1.0.0"
description = "LinkedIn lead harvester: Apify comments → junk filter → Google Sheets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "google-api-python-client>=2.140.0",
  "google-auth>=2.34.0",
  "google-auth-httplib2>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
li-harvester = "li_harvester.runner:main"

[tool.setuptools.packages.find]
include = ["li_harvester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
